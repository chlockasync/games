*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:linear-gradient(135deg,#f3f0f2 0%,#f4f3f2 48%,#edf3f2 100%);color:var(--ink);font-family:Inter,"Segoe UI",Roboto,system-ui,sans-serif;overscroll-behavior:none}

.app{width:min(100%,720px);height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;overflow-x:hidden;overflow-y:auto;padding:max(4px,env(safe-area-inset-top)) 10px max(6px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;scrollbar-width:none;-ms-overflow-style:none}

.instructions span{display:block;white-space:nowrap}
.stats{display:flex;align-items:center;justify-content:center;color:#70798a;font-size:12px;padding:0}
.stat{display:flex;align-items:center;gap:7px;padding:0 15px;white-space:nowrap}

.controls{width:100%;background:transparent;border:0;border-radius:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;box-shadow:none;flex:0 0 auto}
.control{display:flex;min-width:0;height:50px;background:transparent;border:0;border-radius:14px;padding:0;box-shadow:none}
.wheelTrack{position:relative;width:100%;display:flex;flex-direction:column;align-items:stretch;height:50px;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior-y:contain;scrollbar-width:none;-ms-overflow-style:none;border:1px solid #dddbe2;border-radius:14px;background:linear-gradient(180deg,rgba(248,247,250,.97),rgba(242,240,245,.98) 48%,rgba(248,247,250,.97));box-shadow:0 3px 10px rgba(82,81,96,.06);touch-action:pan-y;padding:15px 4px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.26),#000 31%,#000 69%,rgba(0,0,0,.26));-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.26),#000 31%,#000 69%,rgba(0,0,0,.26))}
.wheelTrack::-webkit-scrollbar{display:none}
.wheelOption{position:relative;scroll-snap-align:center;flex:0 0 20px;min-height:20px;padding:1px 6px;border:0;border-radius:7px;background:transparent;color:#858896;font-size:10.5px;font-weight:700;line-height:18px;box-shadow:none;white-space:nowrap;opacity:.62;transition:opacity .12s ease,background .12s ease,color .12s ease,box-shadow .12s ease,font-size .12s ease}

.recordsBtn{border:0;background:transparent;color:var(--muted);padding:0 15px;min-height:0;border-radius:8px;box-shadow:none;text-align:left;cursor:pointer}

.gameTop{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:1px}.boardStage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px 0}.boardWrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:visible;padding:0;flex:1 1 auto}.messageSlot{flex:0 0 auto;width:100%;display:flex;justify-content:center;padding:0}.bottomControls{flex:0 0 auto;width:100%;display:flex;flex-direction:column;gap:4px;padding-top:1px}

.board{position:relative;z-index:2;display:grid;border:0;border-radius:0;background:transparent;gap:0;touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%;overflow:visible;box-shadow:none}
.cell{position:relative;width:var(--cell);height:var(--cell);display:grid;place-items:center;background:transparent;font-size:calc(var(--cell)*.52);font-weight:700;line-height:1;touch-action:none;overflow:visible;border:0;border-radius:0;box-shadow:none}
.cell::before{content:"";position:absolute;inset:4px;border-radius:7px;background:transparent;pointer-events:none}
.cell.region-right,.cell.region-bottom,.cell.last-col,.cell.last-row{border:0}
.cell>*{position:relative;z-index:1}
.cell.x .mark{position:relative;width:52%;height:52%;display:block;transform:none;opacity:.76;filter:none}
.cell.x .mark::before,.cell.x .mark::after{content:"";position:absolute;left:50%;top:50%;width:100%;height:max(4px,calc(var(--cell)*.115));background:rgba(255,255,255,.91);border-radius:999px;box-shadow:0 1px 1px rgba(73,72,90,.12);transform-origin:center}
.cell.x .mark::before{transform:translate(-50%,-50%) rotate(45deg)}
.cell.x .mark::after{transform:translate(-50%,-50%) rotate(-45deg)}
.cell.marker .mark{width:100%;height:100%;display:grid;place-items:center;transform:none}
.cell.marker .coolMarker{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:calc(var(--cell)*.64);line-height:1;filter:none;transform:translateY(7%)}
.cell.marker{animation:markerPop .15s ease-out}
@keyframes markerPop{0%{transform:scale(.72)}78%{transform:scale(1.07)}100%{transform:scale(1)}}
.cell.conflict{outline:3px solid var(--danger);outline-offset:-3px}
.boardArt.hintMode{filter:none;opacity:1}
.board.hintMode .cell{opacity:1;transition:opacity .15s ease,box-shadow .15s ease}
.board.hintMode .cell:not(.hintScope):not(.hint):not(.hintTest)::before{background:transparent;box-shadow:none}
.board.hintMode .cell:not(.hintScope):not(.hint):not(.hintTest).x .mark,.board.hintMode .cell:not(.hintScope):not(.hint):not(.hintTest).marker .mark{opacity:1}
.board.hintMode .cell.hintScope::before{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.96),0 0 0 2px rgba(79,82,108,.36)}
.board.hintMode .cell.hintScope.x .mark,.board.hintMode .cell.hintScope.marker .mark{opacity:1}
.cell.hint{z-index:4!important;opacity:1!important;animation:hintPulse 1s ease-in-out 3}
.cell.hint::after{content:"?";position:absolute;right:5px;top:4px;z-index:3;font-size:calc(var(--cell)*.27);font-weight:950;color:#4f5270;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.cell.hint::before{background:var(--region)!important;box-shadow:inset 0 0 0 3px #fff,0 0 0 3px #595b79!important}
.cell.hintTest{z-index:3!important}
.cell.hintTest::before{background:var(--region)!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.96),0 0 0 3px rgba(91,94,132,.78)!important}

.hintLine{display:block}

function colorDistance(a,b){

function selectedPalette(n){

   let bestI=0,best=-1;

     const d=Math.min(...chosen.map(c=>colorDistance(pool[i],c)));

   const i=r*n+c,a=regions[i];

   if(r<n-1){const b=regions[i+n];if(a!==b){neighbours[a].add(b);neighbours[b].add(a)}}

function drawBoardArt(cellPx){
 const n=state.n;
 const slate='#696678';
 const seamW=.040;       // same-region seam
 const boundaryW=.054;   // true colour-region boundary
 const outerW=.060;      // outer frame
 const radius=.060;
 const parts=[];

 boardArt.setAttribute('viewBox',`0 0 ${n} ${n}`);
 boardArt.setAttribute('width',n*cellPx);
 boardArt.setAttribute('height',n*cellPx);
 boardArt.style.width=`${n*cellPx}px`;
 boardArt.style.height=`${n*cellPx}px`;

 // Start with flat colour cells. They deliberately overlap the eventual seam area;
 // the seam/boundary network is drawn over them afterwards.
 for(let r=0;r<n;r++)for(let c=0;c<n;c++){
   const fill=state.colors[state.regions[r*n+c]];
   parts.push(
     `<rect x="${c}" y="${r}" width="1" height="1" fill="${fill}"/>`
   );
 }

 // Same-region seams first. They are square-ended and run right into grid junctions.
 // If a true region boundary also reaches that junction it is drawn later and masks
 // this seam cleanly, exactly as in the reference.
 for(let r=0;r<n;r++)for(let c=0;c<n;c++){
   const i=r*n+c,rg=state.regions[i],seam=shadeHex(state.colors[rg],.78);
   if(c<n-1 && state.regions[i+1]===rg){
     parts.push(
       `<rect x="${c+1-seamW/2}" y="${r}" width="${seamW}" height="1" fill="${seam}"/>`
     );
   }
   if(r<n-1 && state.regions[i+n]===rg){
     parts.push(
       `<rect x="${c}" y="${r+1-seamW/2}" width="1" height="${seamW}" fill="${seam}"/>`
     );
   }
 }

 // True region boundaries second. Because they sit above the coloured seams they
 // remain continuous and authoritative at T-junctions and crossings.
 for(let r=0;r<n;r++)for(let c=0;c<n;c++){
   const i=r*n+c,rg=state.regions[i];
   if(c<n-1 && state.regions[i+1]!==rg){
     parts.push(
       `<rect x="${c+1-boundaryW/2}" y="${r}" width="${boundaryW}" height="1" fill="${slate}"/>`
     );
   }
   if(r<n-1 && state.regions[i+n]!==rg){
     parts.push(
       `<rect x="${c}" y="${r+1-boundaryW/2}" width="1" height="${boundaryW}" fill="${slate}"/>`
     );
   }
 }

 // Rounded colour faces last. Every cell is inset according to the seam on each
 // edge; this creates the soft corner treatment visible in the reference without
 // allowing the internal seam to punch through a region boundary.
 for(let r=0;r<n;r++)for(let c=0;c<n;c++){
   const i=r*n+c,rg=state.regions[i],fill=state.colors[rg];

   function edgeInset(kind,outer){
     if(outer)return outerW;
     return kind ? seamW/2 : boundaryW/2;
   }

   const sameL=c>0   && state.regions[i-1]===rg;
   const sameR=c<n-1 && state.regions[i+1]===rg;
   const sameT=r>0   && state.regions[i-n]===rg;
   const sameB=r<n-1 && state.regions[i+n]===rg;

   const left   = c===0   ? outerW : (sameL ? seamW/2 : boundaryW/2);
   const right  = c===n-1 ? outerW : (sameR ? seamW/2 : boundaryW/2);
   const top    = r===0   ? outerW : (sameT ? seamW/2 : boundaryW/2);
   const bottom = r===n-1 ? outerW : (sameB ? seamW/2 : boundaryW/2);

   parts.push(
     `<rect x="${c+left}" y="${r+top}" width="${1-left-right}" height="${1-top-bottom}" `+
     `rx="${radius}" ry="${radius}" fill="${fill}"/>`
   );
 }

 // Outer frame last so it is equally clean at every edge.
 parts.push(
   `<rect x="${outerW/2}" y="${outerW/2}" width="${n-outerW}" height="${n-outerW}" `+
   `rx=".095" ry=".095" fill="none" stroke="${slate}" stroke-width="${outerW}"/>`
 );

 boardArt.innerHTML=parts.join('');
}

 const sf=simpleFailure(s),pf=!sf?pairFailure(s):null;if(s.bad||sf||pf)return {key:'current-contradiction',type:'contradiction',targetCells:[],scopeCells:(sf||pf)?.k!=null?units[(sf||pf).k][(sf||pf).u]:[],intro:'Your current marks have made the puzzle impossible.',detail:`Specifically, ${(sf||pf)?.reason||s.reason||'the remaining markers cannot all fit'}.`,reveal:'Undo or reconsider one of your recent marks.'};

   function pairOfDir(i,dir){const r=Math.floor(i/n),c=i%n,g=regions[i];switch(dir){case 0:return[r,c];case 1:return[c,r];case 2:return[r,g];case 3:return[g,r];case 4:return[c,g];default:return[g,c]}}

}
function hint(){

 state.hintUsed=true;state.hintCount=(state.hintCount||0)+1;updatePuzzleMeta();scheduleSave();clearHint();

   state.activeHint=null;
   setMessage('No simpler deduction is available — you’re going to have to move forward with trial and error.','hintMessage');
   return;
 }

 if(state.activeHint&&state.activeHint.key===clue.key)stage=Math.min((state.activeHint.stage||1)+1,3);

}
