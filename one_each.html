<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#f4f1ea" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="One Each" />
<link rel="manifest" href="manifest.webmanifest" />
<title>One Each — endless logic puzzles</title>
<style>
:root{
  --bg:#f3f2f4;--panel:#fbfbfb;--ink:#384253;--muted:#788190;--line:#7d8495;
  --soft:#e3e0e6;--accent:#59637a;--danger:#b25c67;--ok:#4b8b68;--regionEdge:#6d677d;
  --cell:min(11vw,52px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:linear-gradient(135deg,#f3f0f2 0%,#f4f3f2 48%,#edf3f2 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center;min-height:100vh;min-height:100svh;height:100vh;height:100dvh}
button,select,input{font:inherit}
.app{width:min(100%,720px);height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;overflow:hidden;padding:max(4px,env(safe-area-inset-top)) 10px max(6px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 3px 1px;flex:0 0 auto}
.title{font-size:clamp(28px,7.5vw,42px);font-weight:800;letter-spacing:-.04em;line-height:1;color:#58627a}
.stats{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:14px;background:rgba(255,255,255,.82);border:1px solid #e4e2e7;padding:8px 12px;border-radius:18px;box-shadow:0 4px 12px rgba(96,102,126,.08)}
.stat strong{display:block;color:var(--ink);font-size:18px;line-height:1.1;text-align:right}
.controls{width:100%;background:linear-gradient(180deg,#ffffff 0%,#fbfbfb 100%);border:1px solid var(--soft);border-radius:16px;padding:6px 12px 5px;display:grid;grid-template-columns:1fr;gap:3px;box-shadow:0 4px 12px rgba(96,102,126,.07);flex:0 0 auto}
.control{display:flex;flex-direction:column;gap:1px}
.control label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;padding-left:2px;line-height:1}
select,input[type=range]{width:100%}
select{border:1px solid var(--soft);background:#fff;border-radius:12px;padding:10px 12px;color:var(--ink)}
.difficultyScale{position:relative;height:28px;margin:0 2px}
.difficultyRail{position:absolute;left:12px;right:12px;top:10px;height:8px;border-radius:999px;overflow:hidden;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#e5e2e8;box-shadow:inset 0 0 0 1px rgba(82,80,96,.10)}
.difficultyRail span:nth-child(1){background:#b9d9c4}
.difficultyRail span:nth-child(2){background:#d5d2b2}
.difficultyRail span:nth-child(3){background:#ddb8a9}
.difficultyRail span:nth-child(4){background:#c9b5d7}
.difficultyStops{position:absolute;left:12px;right:12px;top:6px;height:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.difficultyStops i{width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #aaa5b2;box-shadow:0 1px 2px rgba(60,58,72,.12)}
.difficultyScale input[type=range]{position:absolute;inset:0;width:100%;height:28px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;z-index:2}
.difficultyScale input[type=range]::-webkit-slider-runnable-track{height:10px;background:transparent}
.difficultyScale input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#706c80;border:4px solid #fff;box-shadow:0 2px 7px rgba(61,58,78,.28);margin-top:-8px}
.difficultyScale input[type=range]::-moz-range-track{height:10px;background:transparent}
.difficultyScale input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:#706c80;border:4px solid #fff;box-shadow:0 2px 7px rgba(61,58,78,.28)}
.scaleLabels{display:grid;grid-template-columns:repeat(5,1fr);margin:0 0 0;color:var(--muted);font-size:10px;font-weight:750}
.scaleLabels button{min-height:23px;padding:2px 1px;border:0;background:transparent;color:inherit;box-shadow:none;border-radius:9px;font-size:10px;font-weight:750}
.scaleLabels button.active{color:#4c495c;background:#efedf2;font-weight:900}
.recordsBtn{border:0;background:transparent;color:var(--muted);padding:0;min-height:0;border-radius:8px;box-shadow:none;text-align:left;cursor:pointer}
.recordsBtn strong{text-align:right}
.recordsTableWrap{overflow-x:auto;margin:12px -4px 4px;padding:0 4px}
.recordsTable{width:100%;min-width:430px;border-collapse:separate;border-spacing:0;font-size:12px;color:#4e5564}
.recordsTable th,.recordsTable td{padding:8px 7px;text-align:center;border-bottom:1px solid #ece9ee}
.recordsTable th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#7b7f8b;font-weight:850;background:#f7f5f8}
.recordsTable th:first-child,.recordsTable td:first-child{text-align:left;font-weight:850;position:sticky;left:0;background:var(--panel)}
.recordsTable tr:last-child td{border-bottom:0}
.sheetHead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheetHead h2{margin:0}
.iconBtn{width:38px;min-height:38px;padding:0;border-radius:50%;background:#efedf2;color:#5a5968;box-shadow:none;font-size:22px;line-height:1}
.dangerBtn{background:#b9656c;color:#fff}
.confirmText{color:#5c5963;line-height:1.45;margin-top:10px}
.gameShell{padding:0;display:flex;flex:1 1 auto;min-height:0;flex-direction:column;gap:0;align-items:stretch;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.gameTop{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:1px}.boardStage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px 0}.boardWrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:visible;padding:0;flex:1 1 auto}.bottomControls{flex:0 0 auto;width:100%;display:flex;flex-direction:column;gap:8px;padding-top:4px}
.boardArt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:block;pointer-events:none;overflow:visible;transition:filter .15s ease,opacity .15s ease}
.board{position:relative;z-index:2;display:grid;border:0;border-radius:0;background:transparent;gap:0;touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%;overflow:visible;box-shadow:none}
.cell{position:relative;width:var(--cell);height:var(--cell);display:grid;place-items:center;background:transparent;font-size:calc(var(--cell)*.52);font-weight:700;line-height:1;touch-action:none;overflow:visible;border:0;border-radius:0;box-shadow:none}
.cell::before{content:"";position:absolute;inset:4px;border-radius:7px;background:transparent;pointer-events:none}
.cell.region-right,.cell.region-bottom,.cell.last-col,.cell.last-row{border:0}
.cell>*{position:relative;z-index:1}
.cell.x .mark{position:relative;width:52%;height:52%;display:block;transform:none;opacity:.76;filter:none}
.cell.x .mark::before,.cell.x .mark::after{content:"";position:absolute;left:50%;top:50%;width:100%;height:max(4px,calc(var(--cell)*.115));background:rgba(255,255,255,.91);border-radius:999px;box-shadow:0 1px 1px rgba(73,72,90,.12);transform-origin:center}
.cell.x .mark::before{transform:translate(-50%,-50%) rotate(45deg)}
.cell.x .mark::after{transform:translate(-50%,-50%) rotate(-45deg)}
.cell.marker .mark{width:100%;height:100%;display:grid;place-items:center;transform:none}
.cell.marker .coolMarker{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:calc(var(--cell)*.64);line-height:1;filter:none;transform:translateY(7%)}
.cell.marker{animation:markerPop .15s ease-out}
@keyframes markerPop{0%{transform:scale(.72)}78%{transform:scale(1.07)}100%{transform:scale(1)}}
.cell.conflict{outline:3px solid var(--danger);outline-offset:-3px}
.boardArt.hintMode{filter:none;opacity:1}
.board.hintMode .cell{opacity:1;transition:opacity .15s ease,box-shadow .15s ease}
.board.hintMode .cell:not(.hintScope):not(.hint):not(.hintTest)::before{inset:1px;border-radius:6px;background:rgba(244,244,246,.72);box-shadow:none}
.board.hintMode .cell:not(.hintScope):not(.hint):not(.hintTest).x .mark,.board.hintMode .cell:not(.hintScope):not(.hint):not(.hintTest).marker .mark{opacity:.28}
.board.hintMode .cell.hintScope::before{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.96),0 0 0 2px rgba(79,82,108,.36)}
.board.hintMode .cell.hintScope.x .mark,.board.hintMode .cell.hintScope.marker .mark{opacity:1}
.cell.hint{z-index:4!important;opacity:1!important;animation:hintPulse 1s ease-in-out 3}
.cell.hint::after{content:"?";position:absolute;right:5px;top:4px;z-index:3;font-size:calc(var(--cell)*.27);font-weight:950;color:#4f5270;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.cell.hint::before{background:var(--region)!important;box-shadow:inset 0 0 0 3px #fff,0 0 0 3px #595b79!important}
.cell.hintTest{z-index:3!important}
.cell.hintTest::before{background:var(--region)!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.96),0 0 0 3px rgba(91,94,132,.78)!important}
@keyframes hintPulse{0%,100%{transform:scale(1)}50%{transform:scale(.94)}}
.puzzleMeta{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;margin:0;font-size:13px;color:var(--muted);flex:0 0 auto}
.puzzleMeta .difficultyNow{font-size:16px;font-weight:850;color:#59627a;background:linear-gradient(180deg,#f3f2f7,#ebe7ef);border:1px solid #ddd8e4;border-radius:999px;padding:6px 12px;box-shadow:0 4px 10px rgba(101,96,117,.08)}
.puzzleMeta .sizeNow{font-weight:750}
.actions{width:100%;display:grid;gap:8px;flex:0 0 auto}.actionsTwo{grid-template-columns:repeat(2,1fr)}
button{border:0;border-radius:14px;padding:12px 10px;background:#6c6878;color:white;font-weight:750;min-height:50px}
button.secondary{background:#eceaf0;color:#4a5362}
button.ghost{background:#fff;color:#4d5667;border:1px solid var(--soft)}
button:disabled{opacity:.45}
.message{min-height:18px;max-height:44px;overflow:hidden;text-align:center;color:#6f7988;font-size:13px;line-height:1.25;padding:0 6px;flex:0 0 auto}
.message.error{color:var(--danger)} .message.good{color:var(--ok)}
.legend{display:flex;justify-content:center;gap:10px;font-size:10px;color:var(--muted);padding:0;line-height:1.1;flex:0 0 auto}
.modal{position:fixed;inset:0;background:rgba(20,18,15,.42);display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:20}
.modal.show{display:flex}.sheet{width:min(100%,560px);background:var(--panel);border-radius:22px;padding:18px;border:1px solid var(--soft);box-shadow:0 10px 28px rgba(70,70,84,.18)}
.sheet h2{margin:0 0 10px;font-size:22px}.sheet p{margin:7px 0;color:#514d46;line-height:1.45}.sheet .row{display:flex;gap:8px;margin-top:14px}.sheet .row button{flex:1}
@media (max-width:420px){.app{padding-left:8px;padding-right:8px}.controls{grid-template-columns:1fr}.gameShell{padding:2px 0 0}.stats{gap:8px}.stat strong{font-size:16px}.puzzleMeta .difficultyNow{font-size:16px}.actions button{font-size:14px;padding-left:6px;padding-right:6px;min-height:50px}.sheet{padding:16px}.recordsTable{font-size:11px}}
@media (max-width:420px){
 .app{padding-left:6px;padding-right:6px;gap:5px}
 header{padding-top:3px}
 .title{font-size:25px}
 .stats{gap:7px;padding:6px 9px;font-size:11px;border-radius:14px}
 .stat strong{font-size:14px}
 .gameShell{gap:0}.gameTop{gap:3px}.bottomControls{gap:6px}
 .puzzleMeta .difficultyNow{font-size:14px;padding:4px 9px}
 .actions button{font-size:14px;padding:11px 6px;min-height:50px}
 .controls{padding:5px 9px 4px;border-radius:14px}
 .control label{font-size:9px}
 .scaleLabels,.scaleLabels button{font-size:9px}
 .message{font-size:12px;max-height:40px}
 .legend{font-size:9px}
}
@media (max-height:700px){
 .title{font-size:23px}.stats{padding:5px 8px}
 .gameShell{gap:0}.gameTop{gap:2px}.bottomControls{gap:5px}
 .actions button{min-height:44px;padding:8px 6px}
 .controls{padding-top:4px;padding-bottom:3px}
 .difficultyScale{height:24px}
 .difficultyScale input[type=range]{height:24px}
 .scaleLabels button{min-height:20px}
 .legend{font-size:9px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">One Each</div>
    <div class="stats">
      <div class="stat">Time<strong id="timer">0:00</strong></div>
      <button id="recordsBtn" class="stat recordsBtn" type="button" aria-label="View best-time records">Records<strong id="bestTop">—</strong></button>
    </div>
  </header>

  <section class="gameShell">
    <div class="gameTop">
      <div class="puzzleMeta"><span id="difficultyNow" class="difficultyNow" title="Difficulty is rated by the deduction system.">—</span></div>
      <div class="legend">One 😎 per row · column · colour · 😎 may not touch diagonally</div>
      <div id="message" class="message"></div>
    </div>

    <div id="boardStage" class="boardStage">
      <div class="boardWrap"><svg id="boardArt" class="boardArt" aria-hidden="true"></svg><div id="board" class="board" aria-label="One Each puzzle board"></div></div>
    </div>

    <div class="bottomControls">
      <div class="actions actionsTwo">
        <button id="undoBtn" class="ghost" disabled>Undo</button>
        <button id="hintBtn" class="ghost">Hint</button>
      </div>

      <section class="controls">
        <div class="control">
          <label>Difficulty mix</label>
          <div id="difficultyScale" class="difficultyScale">
            <div class="difficultyRail" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <div class="difficultyStops" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
            <input id="difficulty" type="range" min="0" max="100" step="25" value="75" aria-label="Difficulty mix" />
          </div>
          <div id="scaleLabels" class="scaleLabels">
            <button type="button" data-bias="0">Easy</button>
            <button type="button" data-bias="25">Medium</button>
            <button type="button" data-bias="50">Hard</button>
            <button type="button" data-bias="75">Expert</button>
            <button type="button" data-bias="100">Brutal</button>
          </div>
        </div>
      </section>

      <div class="actions actionsTwo">
        <button id="restartBtn" class="ghost">Restart</button>
        <button id="newGameBtn" class="ghost">New game</button>
      </div>
    </div>
  </section>
</div>

<div id="winModal" class="modal">
  <div class="sheet">
    <h2>Congratulations! 🎉</h2>
    <p id="winText"></p>
    <div class="row"><button id="nextBtn">Next puzzle</button></div>
  </div>
</div>

<div id="recordsModal" class="modal" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="recordsTitle">
    <div class="sheetHead">
      <h2 id="recordsTitle">Best times</h2>
      <button id="closeRecordsBtn" class="iconBtn" type="button" aria-label="Close records">×</button>
    </div>
    <div class="recordsTableWrap">
      <table id="recordsTable" class="recordsTable"></table>
    </div>
    <div class="row">
      <button id="clearRecordsBtn" class="dangerBtn" type="button">Clear records</button>
      <button id="doneRecordsBtn" type="button">Done</button>
    </div>
  </div>
</div>

<div id="clearConfirmModal" class="modal" aria-hidden="true">
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="clearRecordsTitle">
    <h2 id="clearRecordsTitle">Clear all records?</h2>
    <p class="confirmText">This removes every saved best time. Your current game and other local progress are not affected.</p>
    <div class="row">
      <button id="cancelClearBtn" class="ghost" type="button">Cancel</button>
      <button id="confirmClearBtn" class="dangerBtn" type="button">Clear records</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const boardEl=document.getElementById('board'), boardArt=document.getElementById('boardArt'), boardWrap=document.querySelector('.boardWrap'), boardStage=document.getElementById('boardStage'), diffEl=document.getElementById('difficulty'), difficultyScale=document.getElementById('difficultyScale'), scaleLabels=document.getElementById('scaleLabels');
const timerEl=document.getElementById('timer'), bestTop=document.getElementById('bestTop'), msg=document.getElementById('message');
const undoBtn=document.getElementById('undoBtn'), hintBtn=document.getElementById('hintBtn'), restartBtn=document.getElementById('restartBtn'), newGameBtn=document.getElementById('newGameBtn');
const difficultyNow=document.getElementById('difficultyNow');
const winModal=document.getElementById('winModal'), winText=document.getElementById('winText'), nextBtn=document.getElementById('nextBtn');
const recordsBtn=document.getElementById('recordsBtn'), recordsModal=document.getElementById('recordsModal'), recordsTable=document.getElementById('recordsTable'), closeRecordsBtn=document.getElementById('closeRecordsBtn'), doneRecordsBtn=document.getElementById('doneRecordsBtn'), clearRecordsBtn=document.getElementById('clearRecordsBtn');
const clearConfirmModal=document.getElementById('clearConfirmModal'), cancelClearBtn=document.getElementById('cancelClearBtn'), confirmClearBtn=document.getElementById('confirmClearBtn');


const COLOR_POOL=[
 '#55d2f0', // aqua
 '#e59abc', // dusty pink
 '#ff878c', // coral
 '#9f8fe3', // lavender violet
 '#59c97f', // fresh green
 '#74a2ee', // medium blue
 '#e4c669', // warm yellow
 '#e99b70', // peach orange
 '#69c8b6', // teal
 '#bc87d5', // orchid
 '#a7c96d', // lime/sage
 '#d68fa3', // rose
 '#72b7ce', // blue teal
 '#caa779', // sand
 '#8dbd78', // green-sage
 '#aa9bd4'  // soft lilac
];
const COLOR_NAMES={
 '#55d2f0':'aqua',
 '#e59abc':'pink',
 '#ff878c':'coral',
 '#9f8fe3':'purple',
 '#59c97f':'green',
 '#74a2ee':'blue',
 '#e4c669':'yellow',
 '#e99b70':'orange',
 '#69c8b6':'teal',
 '#bc87d5':'mauve',
 '#a7c96d':'lime',
 '#d68fa3':'rose',
 '#72b7ce':'blue-green',
 '#caa779':'tan',
 '#8dbd78':'sage',
 '#aa9bd4':'lilac'
};
let state=null, timerTick=null, hiddenAt=null;
const LS='one_each_logic_v1';
const LEGACY_LS=atob('cXVlZW5zX2xvZ2ljX3Y0');
function loadStore(){
 try{
   let raw=localStorage.getItem(LS);
   if(!raw){raw=localStorage.getItem(LEGACY_LS);if(raw){localStorage.setItem(LS,raw);localStorage.removeItem(LEGACY_LS)}}
   return JSON.parse(raw||'{}')
 }catch{return {}}
}
function saveStore(s){try{localStorage.setItem(LS,JSON.stringify(s))}catch{}}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function keyBest(n,band){return `best_${n}_${band}`}
const BANDS=['Easy','Medium','Hard','Expert','Brutal'];
const DIFFICULTY_MIX={
  0:   [0.72,0.22,0.05,0.01,0.00],
  25:  [0.15,0.60,0.20,0.05,0.00],
  50:  [0.05,0.20,0.50,0.20,0.05],
  75:  [0.01,0.05,0.20,0.59,0.15],
  100: [0.00,0.01,0.06,0.22,0.71]
};
function snapBias(v){return Math.max(0,Math.min(100,Math.round((+v||0)/25)*25))}
function difficultyMix(v){return DIFFICULTY_MIX[snapBias(v)]||DIFFICULTY_MIX[50]}
function sampleBand(v){
  const mix=difficultyMix(v);let x=Math.random();
  for(let i=0;i<mix.length;i++){x-=mix[i];if(x<=0)return BANDS[i]}
  return BANDS[mix.length-1];
}
function updateDiff(){
  const v=snapBias(diffEl.value);if(+diffEl.value!==v)diffEl.value=v;
  const idx=v/25;
  [...scaleLabels.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('active',i===idx));
  diffEl.setAttribute('aria-valuetext',BANDS[idx]);
}
function setDifficulty(v){
  diffEl.value=snapBias(v);updateDiff();
  const store=loadStore();store.bias=+diffEl.value;store.generatedPool=[];saveStore(store);
  generatedPool=[];
  if(generatorWorker)generatorWorker.postMessage({bias:+diffEl.value});
  requestGeneration(100);
}
const savedBias=+loadStore().bias;if(Number.isFinite(savedBias)&&savedBias>=0&&savedBias<=100)diffEl.value=snapBias(savedBias);
diffEl.addEventListener('input',()=>setDifficulty(+diffEl.value));

       detail:`Those colours are ${colours}. ${L} columns need ${L} different colours, so those colours are reserved for those columns.`
     };
   }

   function groupCells(type,left,rights){
     const L=new Set(left),R=new Set(rights),out=[];

       const [a,b]=pairOf(i,type);

     }
     return uniqueCells(out);
   }

   for(let type=0;type<3;type++){
     const adj=Array.from({length:n},()=>[]),edgeCells=Array.from({length:n},()=>Array.from({length:n},()=>[]));
     for(let i=0;i<total;i++)if(s.cand[i]){
       const [a,b]=pairOf(i,type);

     }
     for(let a=0;a<n;a++)for(let b=0;b<n;b++)if(edgeCells[a][b].length)adj[a].push(b);

     // If the player's current marks have already made a one-to-one assignment
     // impossible, report that before offering a new move.
     if(!hasPM(adj)){
       const h=hallFailure(adj);

     }

     for(let a=0;a<n;a++)for(const b of adj[a]){
       if(hasPM(adj,a,b))continue;

       const targets=edgeCells[a][b].filter(i=>!s.fixed[i]);
       if(!targets.length)continue;

       // Forcing a->b exposes a deficient set among the *other* units. In the
       // original puzzle that set has exactly one extra option: b. Therefore

       const h=hallFailure(adj,a,b);

       if(rights.length!==h.left.length)continue;

       // Size-one reservations are simpler region/line or singleton deductions
       // and are handled by earlier tiers.
       if(h.left.length<2)continue;

       const copy=reservedText(type,h.left,rights);
       const reserved=groupCells(type,h.left,rights);
       const stage2=uniqueCells([...reserved,...targets]);

       let consequence;
       if(type===0)consequence=`Row ${a+1} is outside that group, so it cannot use column ${b+1}.`;

         complexity:h.left.length,

         type:'matching',

         detail:`${copy.detail} ${consequence}`,

   }

   if(!options.length)return null;
   options.sort((x,y)=>x.complexity-y.complexity||x.typeRank-y.typeRank||x.targetCells.length-y.targetCells.length);
   return options[0];
 }
 function deterministicPropagate(s,trace=[]){

 }
 function candidateOrder(s){
   const scores=[];for(let i=0;i<total;i++)if(s.cand[i]&&!s.fixed[i]){const r=Math.floor(i/n),c=i%n,rg=regions[i];let rc=0,cc=0,gc=0;for(let x=0;x<n;x++){rc+=s.cand[r*n+x];cc+=s.cand[x*n+c]}for(let j=0;j<total;j++)if(regions[j]===rg)gc+=s.cand[j];scores.push([Math.min(rc,cc,gc),rc+cc+gc,i])}scores.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);return scores.map(x=>x[2]);
 }


 const s=makeState();
 // Apply the player's explicit X marks first, then their placed markers.
 for(let i=0;i<total;i++)if(state.marks[i]===1)s.cand[i]=0;
 for(let i=0;i<total;i++)if(state.marks[i]===2)place(s,i);
 if(!checkUnits(s)||s.bad){return {key:'current-contradiction',type:'contradiction',targetCells:[],scopeCells:[],intro:'Your current marks have made the puzzle impossible.',detail:`As marked, ${s.reason || 'at least one row, column or colour has no legal completion'}.`,reveal:'Undo or reconsider one of your X marks.'}}

 let conflict=currentAdjacentRowConflict(s);
 if(conflict)return conflict;

 // Same ordering as the difficulty engine's deterministic propagation.

 // No non-trial deduction remains. Do not pick or demonstrate a branch.
 return {

   targetCells:[],
   scopeCells:[],

   detail:'No simpler deduction is available — you’re going to have to move forward with trial and error.',

 };
}
function hint(){
