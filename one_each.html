<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#f4f1ea" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-title" content="One Each" />
<title>One Each — endless logic puzzles</title>
<style>
:root{
  --bg:#f3f2f4;--panel:#fbfbfb;--ink:#384253;--muted:#788190;--line:#7d8495;
  --soft:#e3e0e6;--accent:#59637a;--danger:#b25c67;--ok:#4b8b68;--regionEdge:#6d677d;
  --cell:min(11vw,52px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:linear-gradient(135deg,#f3f0f2 0%,#f4f3f2 48%,#edf3f2 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;justify-content:center;min-height:100vh;min-height:100svh;height:100vh;height:100dvh}
button,select,input{font:inherit}
.app{width:min(100%,720px);height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;overflow-x:hidden;overflow-y:auto;padding:max(4px,env(safe-area-inset-top)) 10px max(6px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;scrollbar-width:none;-ms-overflow-style:none}
.app::-webkit-scrollbar{display:none}
header{display:flex;flex-direction:column;gap:0;padding:8px 6px 1px;flex:0 0 auto}
.brandRow{display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:center;gap:12px;min-width:0}
.title{font-size:clamp(33px,9vw,43px);font-weight:820;letter-spacing:-.045em;line-height:.98;color:#556078;white-space:nowrap}
.instructions{min-width:0;font-size:clamp(10px,2.72vw,12.2px);line-height:1.28;color:#515d72;font-weight:620;text-align:center;letter-spacing:-.012em}
.instructions span{display:block;white-space:nowrap}
.stats{display:flex;align-items:center;justify-content:center;color:#70798a;font-size:12px;padding:0}
.stat{display:flex;align-items:center;gap:7px;padding:0 15px;white-space:nowrap}
.stat+.stat{border-left:1px solid #d8d5de}
.stat strong{display:block;color:#3f495b;font-size:17px;line-height:1.1;text-align:right;font-weight:820}
.controls{width:100%;background:transparent;border:0;border-radius:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;box-shadow:none;flex:0 0 auto}
.control{display:flex;min-width:0;height:50px;background:transparent;border:0;border-radius:14px;padding:0;box-shadow:none}
.wheelTrack{position:relative;width:100%;display:flex;flex-direction:column;align-items:stretch;height:50px;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior-y:contain;scrollbar-width:none;-ms-overflow-style:none;border:1px solid #dddbe2;border-radius:14px;background:linear-gradient(180deg,rgba(248,247,250,.97),rgba(242,240,245,.98) 48%,rgba(248,247,250,.97));box-shadow:0 3px 10px rgba(82,81,96,.06);touch-action:pan-y;padding:15px 4px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.26),#000 31%,#000 69%,rgba(0,0,0,.26));-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.26),#000 31%,#000 69%,rgba(0,0,0,.26))}
.wheelTrack::-webkit-scrollbar{display:none}
.wheelOption{position:relative;scroll-snap-align:center;flex:0 0 20px;min-height:20px;padding:1px 6px;border:0;border-radius:7px;background:transparent;color:#858896;font-size:10.5px;font-weight:700;line-height:18px;box-shadow:none;white-space:nowrap;opacity:.62;transition:opacity .12s ease,background .12s ease,color .12s ease,box-shadow .12s ease,font-size .12s ease}
.wheelOption.active{background:rgba(255,255,255,.96);color:#45495b;font-size:12.5px;font-weight:900;opacity:1;box-shadow:0 1px 4px rgba(74,71,89,.13),inset 0 0 0 1px rgba(108,104,124,.08)}
.recordsBtn{border:0;background:transparent;color:var(--muted);padding:0 15px;min-height:0;border-radius:8px;box-shadow:none;text-align:left;cursor:pointer}
.recordsBtn strong{text-align:right}
.statIcon{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btnIcon{width:21px;height:21px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.message:not(:empty):not(.hintMessage){width:min(100%,620px);min-height:38px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.80);border:1px solid #dfdce4;border-radius:12px;padding:7px 11px;box-shadow:0 3px 10px rgba(80,78,96,.05)}
.recordsTableWrap{overflow-x:auto;margin:12px -4px 4px;padding:0 4px}
.recordsTable{width:100%;min-width:430px;border-collapse:separate;border-spacing:0;font-size:12px;color:#4e5564}
.recordsTable th,.recordsTable td{padding:8px 7px;text-align:center;border-bottom:1px solid #ece9ee}
.recordsTable th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#7b7f8b;font-weight:850;background:#f7f5f8}
.recordsTable th:first-child,.recordsTable td:first-child{text-align:left;font-weight:850;position:sticky;left:0;background:var(--panel)}
.recordsTable tr:last-child td{border-bottom:0}
.sheetHead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheetHead h2{margin:0}
.iconBtn{width:38px;min-height:38px;padding:0;border-radius:50%;background:#efedf2;color:#5a5968;box-shadow:none;font-size:22px;line-height:1}
.dangerBtn{background:#b9656c;color:#fff}
.confirmText{color:#5c5963;line-height:1.45;margin-top:10px}
.gameShell{padding:0;display:flex;flex:1 0 auto;min-height:0;flex-direction:column;gap:0;align-items:stretch;touch-action:auto;user-select:none;-webkit-user-select:none;overflow:visible}
.gameTop{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:1px}.boardStage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px 0}.boardWrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:visible;padding:0;flex:1 1 auto}.messageSlot{flex:0 0 auto;width:100%;display:flex;justify-content:center;padding:0}.bottomControls{flex:0 0 auto;width:100%;display:flex;flex-direction:column;gap:4px;padding-top:1px}
.boardArt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:block;pointer-events:none;overflow:visible;transition:filter .15s ease,opacity .15s ease}
.board{position:relative;z-index:2;display:grid;border:0;border-radius:0;background:transparent;gap:0;touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%;overflow:visible;box-shadow:none}
.cell{position:relative;width:var(--cell);height:var(--cell);display:grid;place-items:center;background:transparent;font-size:calc(var(--cell)*.52);font-weight:700;line-height:1;touch-action:none;overflow:visible;border:0;border-radius:0;box-shadow:none}
.cell::before{content:"";position:absolute;inset:4px;border-radius:7px;background:transparent;pointer-events:none}
.cell.region-right,.cell.region-bottom,.cell.last-col,.cell.last-row{border:0}
.cell>*{position:relative;z-index:1}
.cell.x .mark{position:relative;width:52%;height:52%;display:block;transform:none;opacity:.76;filter:none}
.cell.x .mark::before,.cell.x .mark::after{content:"";position:absolute;left:50%;top:50%;width:100%;height:max(4px,calc(var(--cell)*.115));background:rgba(255,255,255,.91);border-radius:999px;box-shadow:0 1px 1px rgba(73,72,90,.12);transform-origin:center}
.cell.x .mark::before{transform:translate(-50%,-50%) rotate(45deg)}
.cell.x .mark::after{transform:translate(-50%,-50%) rotate(-45deg)}
.cell.marker .mark{width:100%;height:100%;display:grid;place-items:center;transform:none}
.cell.marker .coolMarker{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:calc(var(--cell)*.64);line-height:1;filter:none;transform:translateY(7%)}
.cell.marker{animation:markerPop .15s ease-out}
@keyframes markerPop{0%{transform:scale(.72)}78%{transform:scale(1.07)}100%{transform:scale(1)}}
.cell.conflict{outline:3px solid var(--danger);outline-offset:-3px}
.boardArt.hintMode{filter:none;opacity:1}
.board.hintMode .cell{opacity:1;transition:opacity .15s ease,box-shadow .15s ease}
.board.hintMode .cell:not(.hintScope):not(.hint):not(.hintTest)::before{inset:1px;border-radius:6px;background:rgba(244,244,246,.72);box-shadow:none}
.board.hintMode .cell:not(.hintScope):not(.hint):not(.hintTest).x .mark,.board.hintMode .cell:not(.hintScope):not(.hint):not(.hintTest).marker .mark{opacity:.28}
.board.hintMode .cell.hintScope::before{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.96),0 0 0 2px rgba(79,82,108,.36)}
.board.hintMode .cell.hintScope.x .mark,.board.hintMode .cell.hintScope.marker .mark{opacity:1}
.cell.hint{z-index:4!important;opacity:1!important;animation:hintPulse 1s ease-in-out 3}
.cell.hint::after{content:"?";position:absolute;right:5px;top:4px;z-index:3;font-size:calc(var(--cell)*.27);font-weight:950;color:#4f5270;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.cell.hint::before{background:var(--region)!important;box-shadow:inset 0 0 0 3px #fff,0 0 0 3px #595b79!important}
.cell.hintTest{z-index:3!important}
.cell.hintTest::before{background:var(--region)!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.96),0 0 0 3px rgba(91,94,132,.78)!important}
@keyframes hintPulse{0%,100%{transform:scale(1)}50%{transform:scale(.94)}}
.puzzleMeta{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;margin:0;font-size:13px;color:var(--muted);flex:0 0 auto}
.puzzleMeta .difficultyNow{font-size:16px;font-weight:850;color:#59627a;background:linear-gradient(180deg,#f3f2f7,#ebe7ef);border:1px solid #ddd8e4;border-radius:999px;padding:6px 12px;box-shadow:0 4px 10px rgba(101,96,117,.08)}
.puzzleMeta .sizeNow{font-weight:750}
.actions{width:100%;display:grid;gap:4px;flex:0 0 auto}.actionsTwo{grid-template-columns:repeat(2,1fr)}
button{border:0;border-radius:14px;padding:11px 10px;background:#6c6878;color:white;font-weight:760;min-height:50px}
button.secondary{background:#eceaf0;color:#4a5362}
button.ghost{display:flex;align-items:center;justify-content:center;gap:9px;background:rgba(255,255,255,.91);color:#495369;border:1px solid #dddbe2;box-shadow:0 3px 10px rgba(82,81,96,.06)}
button:disabled{opacity:.45}
.message{min-height:0;max-height:none;overflow:visible;text-align:center;color:#606a7c;font-size:13px;line-height:1.38;padding:0;flex:0 0 auto}
.message.error{color:var(--danger)} .message.good{color:var(--ok)}
.message.hintMessage{width:min(100%,620px);text-align:left;background:rgba(255,255,255,.92);border:1px solid #dfdce4;border-radius:12px;padding:9px 12px;color:#586171;box-shadow:0 3px 10px rgba(80,78,96,.06)}
.hintLine{display:block}
.hintLine:first-child{font-weight:800;color:#4f5869}
.hintLine+.hintLine{margin-top:4px;padding-top:4px;border-top:1px solid #ece9ef}

.modal{position:fixed;inset:0;background:rgba(20,18,15,.42);display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:20}
.modal.show{display:flex}.sheet{width:min(100%,560px);background:var(--panel);border-radius:22px;padding:18px;border:1px solid var(--soft);box-shadow:0 10px 28px rgba(70,70,84,.18)}
.sheet h2{margin:0 0 10px;font-size:22px}.sheet p{margin:7px 0;color:#514d46;line-height:1.45}.sheet .row{display:flex;gap:8px;margin-top:14px}.sheet .row button{flex:1}
@media (max-width:420px){.app{padding-left:8px;padding-right:8px}.gameShell{padding:2px 0 0}.stats{gap:10px}.puzzleMeta .difficultyNow{font-size:16px}.actions button{font-size:14px;padding-left:6px;padding-right:6px;min-height:50px}.sheet{padding:16px}.recordsTable{font-size:11px}}
@media (max-width:420px){
 .app{padding-left:6px;padding-right:6px;gap:5px}
 header{padding-top:4px;gap:5px}
 .brandRow{gap:9px}
 .title{font-size:26px}
 .instructions{font-size:10.5px;line-height:1.22;padding-top:0}
 .stats{font-size:10px}
 .stat{padding:0 10px;gap:5px}
 .stat strong{font-size:13px}
 .gameShell{gap:0}.gameTop{gap:3px}.bottomControls{gap:6px}
 .puzzleMeta .difficultyNow{font-size:14px;padding:4px 9px}
 .actions button{font-size:14px;padding:11px 6px;min-height:50px}
 .controls{padding:4px 6px 5px;border-radius:13px;gap:6px}
 .control label{font-size:7.5px}
 .wheelTrack{height:40px;padding:10px 3px}
 .wheelOption{font-size:9.5px;flex-basis:20px;min-height:20px}
 .message{font-size:12px;max-height:72px}
}
@media (max-height:700px){
 .title{font-size:23px}
 .instructions{font-size:9.5px}
 .stats{font-size:9.5px}.stat strong{font-size:12px}
 .gameShell{gap:0}.gameTop{gap:2px}.bottomControls{gap:5px}
 .actions button{min-height:44px;padding:8px 6px}
 .controls{padding-top:3px;padding-bottom:4px}
 .wheelTrack{height:36px;padding:8px 3px}
 .wheelOption{flex-basis:20px;min-height:20px}
 .message{max-height:64px}
}

@media (max-width:420px){
 .app{padding-left:7px;padding-right:7px;gap:6px}
 header{padding:7px 5px 2px;gap:7px}
 .brandRow{gap:12px}
 .title{font-size:clamp(32px,9vw,38px)}
 .instructions{font-size:clamp(10.6px,3.05vw,12.6px);line-height:1.27;padding-top:1px}
 .stats{font-size:12px}
 .stat{padding:0 12px;gap:6px}
 .recordsBtn{padding:0 12px}
 .stat strong{font-size:15.5px}
 .statIcon{width:17px;height:17px}
 .gameTop{gap:5px}
 .puzzleMeta .difficultyNow{font-size:14px;padding:5px 10px}
 .bottomControls{gap:7px}
 .actions button{font-size:14px;padding:10px 6px;min-height:49px}
 .btnIcon{width:20px;height:20px}
 .controls{gap:8px}
 .control{padding:5px 6px 6px}
 .control label{font-size:8px}
 .wheelTrack{height:48px;padding:14px 3px}
 .wheelOption{font-size:10px;flex-basis:20px;min-height:20px}
 .wheelOption.active{font-size:12px}
 .message{font-size:12px;max-height:76px}
 .message:not(:empty):not(.hintMessage){min-height:36px;padding:7px 9px}
}
@media (max-width:360px){
 .brandRow{gap:9px}
 .title{font-size:31px}
 .instructions{font-size:10.4px}
 .stat{padding:0 9px}
 .recordsBtn{padding:0 9px}
 .controls{gap:6px}
}
@media (max-height:700px){
 header{padding-top:3px;gap:4px}
 .title{font-size:30px}
 .instructions{font-size:10px;line-height:1.2}
 .stats{font-size:10.5px}.stat strong{font-size:13px}.statIcon{width:15px;height:15px}
 .gameTop{gap:3px}.bottomControls{gap:5px}
 .actions button{min-height:43px;padding:7px 5px}
 .btnIcon{width:18px;height:18px}
 .control{padding-top:4px;padding-bottom:4px}
 .wheelTrack{height:42px;padding:11px 3px}
 .message:not(:empty):not(.hintMessage){min-height:32px;padding:5px 8px}
}

/* compact layout refinement */
@media (max-width:420px){
  .app{padding-left:7px;padding-right:7px;gap:4px}
  header{padding:6px 4px 1px}
  .brandRow{gap:10px}
  .title{font-size:clamp(31px,8.9vw,37px)}
  .instructions{font-size:clamp(9.7px,2.66vw,11px);line-height:1.25}
  .gameTop{gap:2px}
  .puzzleMeta .difficultyNow{font-size:14px;padding:4px 9px}
  .stats{font-size:10.5px}
  .stat{padding:0 9px;gap:5px}
  .recordsBtn{padding:0 9px}
  .stat strong{font-size:13.5px}
  .statIcon{width:15px;height:15px}
  .boardStage{padding:2px 0}
  .messageSlot{padding:0}
  .bottomControls{gap:3px;padding-top:0}
  .actions{gap:3px}
  .controls{gap:3px;padding:0;background:transparent;border:0;box-shadow:none}
  .control{padding:0!important;background:transparent;border:0;box-shadow:none}
  .actions button,.control,.wheelTrack{min-height:48px;height:48px}
  .actions button{padding:8px 5px}
  .wheelTrack{padding:14px 3px}
  .wheelOption{font-size:9.8px;flex-basis:20px;min-height:20px}
  .wheelOption.active{font-size:12px}
  .message{font-size:12px;max-height:none;overflow:visible}

  .message.hintMessage{padding:8px 10px}
}
@media (max-width:360px){
  .title{font-size:30px}
  .instructions{font-size:8.9px}
  .brandRow{gap:8px}
}

  .app{gap:3px}
  header{padding-top:3px}
  .title{font-size:29px}
  .instructions{font-size:9.2px}
  .puzzleMeta .difficultyNow{padding:3px 8px}
  .actions button,.control,.wheelTrack{min-height:43px;height:43px}
  .wheelTrack{padding:11px 3px}

</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brandRow">
      <div class="title">One Each</div>
      <div class="instructions"><span>Find one 😎 in each row, column, and colour.</span><span>They're not next to each other.</span></div>
    </div>
  </header>

  <section class="gameShell">
    <div class="gameTop">
      <div class="puzzleMeta"><span id="difficultyNow" class="difficultyNow" title="Difficulty is rated by the deduction system.">—</span></div>
      <div class="stats">
        <div class="stat"><svg class="statIcon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3 2"/></svg><span>Time</span><strong id="timer">0:00</strong></div>
        <button id="recordsBtn" class="stat recordsBtn" type="button" aria-label="View best times"><svg class="statIcon" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5v2a4 4 0 0 0 4 4M16 6h3v2a4 4 0 0 1-4 4M12 13v4M9 20h6M10 17h4"/></svg><span>Best time</span><strong id="bestTop">—</strong></button>
      </div>
    </div>

    <div id="boardStage" class="boardStage">
      <div class="boardWrap"><svg id="boardArt" class="boardArt" aria-hidden="true"></svg><div id="board" class="board" aria-label="One Each puzzle board"></div></div>
    </div>

    <div class="messageSlot"><div id="message" class="message"></div></div>

    <div class="bottomControls">
      <div class="actions actionsTwo">
        <button id="undoBtn" class="ghost" disabled><svg class="btnIcon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 8H4V3"/><path d="M4.5 8a8 8 0 1 1 .7 8.8"/></svg><span>Undo</span></button>
        <button id="hintBtn" class="ghost"><svg class="btnIcon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M8.2 15.3A7 7 0 1 1 15.8 15.3C14.7 16.1 14 17 14 18h-4c0-1-.7-1.9-1.8-2.7z"/><path d="M12 1v2M4.2 4.2l1.4 1.4M19.8 4.2l-1.4 1.4M2 12h2M20 12h2"/></svg><span>Hint</span></button>
      </div>

      <section class="controls">
        <div class="control">
          <div id="difficultyWheel" class="wheelTrack" role="listbox" aria-label="Difficulty mix">
            <button class="wheelOption" type="button" data-value="0">Easy</button>
            <button class="wheelOption" type="button" data-value="25">Medium</button>
            <button class="wheelOption" type="button" data-value="50">Hard</button>
            <button class="wheelOption" type="button" data-value="75">Expert</button>
            <button class="wheelOption" type="button" data-value="100">Brutal</button>
          </div>
        </div>
        <div class="control">
          <div id="sizeWheel" class="wheelTrack sizeWheel" role="listbox" aria-label="Board size">
            <button class="wheelOption" type="button" data-value="small">Small</button>
            <button class="wheelOption" type="button" data-value="medium">Medium</button>
            <button class="wheelOption" type="button" data-value="large">Large</button>
            <button class="wheelOption" type="button" data-value="random">Random</button>
          </div>
        </div>
      </section>

      <div class="actions actionsTwo">
        <button id="restartBtn" class="ghost"><svg class="btnIcon" aria-hidden="true" viewBox="0 0 24 24"><path d="M19 7V3l-4 4 4 4V7a8 8 0 1 0 1 7"/></svg><span>Restart</span></button>
        <button id="newGameBtn" class="ghost"><svg class="btnIcon" aria-hidden="true" viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span>New game</span></button>
      </div>
    </div>
  </section>
</div>

<div id="winModal" class="modal">
  <div class="sheet">
    <h2>Congratulations! 🎉</h2>
    <p id="winText"></p>
    <div class="row"><button id="nextBtn">Next puzzle</button></div>
  </div>
</div>

<div id="recordsModal" class="modal" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="recordsTitle">

function puzzleTransforms(n,regions){

           detail:`That square is at row ${r+1}, column ${c+1}. Its column and diagonals cover every remaining option in row ${rr+1}.`,
           reveal:`Cross row ${r+1}, column ${c+1}.`
         };

 function hasPM(adj,fa=-1,fb=-1){
   const match=Array(n).fill(-1);if(fa>=0){if(!adj[fa].includes(fb))return false;match[fb]=fa}
   function dfs(a,seen){for(const b of adj[a]){if(b===fb)continue;if(seen[b])continue;seen[b]=1;if(match[b]<0||dfs(match[b],seen)){match[b]=a;return true}}return false}

 }
 function pairOf(i,type){const r=Math.floor(i/n),c=i%n,rg=regions[i];return type===0?[r,c]:type===1?[r,rg]:[c,rg]}
 function matchingName(type,a,b){
   if(type===0)return {a:`row ${a+1}`,b:`column ${b+1}`,pair:`row ${a+1} used column ${b+1}`,rest:'the remaining rows could not all take different columns'};
   const colour=regionColourName(b);
   if(type===1)return {a:`row ${a+1}`,b:`the ${colour} region`,pair:`row ${a+1} used the ${colour} region`,rest:'the remaining rows and colour regions could not be paired one-to-one'};
   return {a:`column ${a+1}`,b:`the ${colour} region`,pair:`column ${a+1} used the ${colour} region`,rest:'the remaining columns and colour regions could not be paired one-to-one'};
 }
 function hallFailure(adj,forcedA=-1,forcedB=-1){
   const left=[];for(let a=0;a<n;a++)if(a!==forcedA)left.push(a);
   const lim=1<<left.length;let best=null;
   for(let mask=1;mask<lim;mask++){
     const subset=[],rights=new Set();
     for(let k=0;k<left.length;k++)if(mask&(1<<k)){
       const a=left[k];subset.push(a);for(const b of adj[a])if(b!==forcedB)rights.add(b);
     }

   }

 }
 function nums(a){return a.map(x=>x+1).join(', ')}
 function hallText(type,h){
   if(!h)return 'the remaining one-to-one assignments cannot all be satisfied';
   const L=h.left.length,R=h.rights.length;
   if(type===0)return `${L===1?'Row':'Rows'} ${nums(h.left)} ${L===1?'is':'are'} limited to ${R===1?'column':'columns'} ${nums(h.rights)}. ${L} ${L===1?'row needs':'rows need'} ${L} different ${L===1?'column':'columns'}, but only ${R} ${R===1?'is':'are'} available`;
   const colours=colourNames(h.rights);
   if(type===1)return `${L===1?'Row':'Rows'} ${nums(h.left)} can only use ${colours}. ${L} ${L===1?'row needs':'rows need'} ${L} different colour regions, but only ${R} ${R===1?'is':'are'} available`;
   return `${L===1?'Column':'Columns'} ${nums(h.left)} can only use ${colours}. ${L} ${L===1?'column needs':'columns need'} ${L} different colour regions, but only ${R} ${R===1?'is':'are'} available`;
 }
 function hallScope(type,h){
   if(!h)return [];
   let scope=[];
   if(type===0){for(const r of h.left)scope.push(...cellsInRow(r,n));for(const c of h.rights)scope.push(...cellsInCol(c,n))}
   else if(type===1){for(const r of h.left)scope.push(...cellsInRow(r,n));for(const rg of h.rights)scope.push(...cellsInRegion(rg,n))}
   else {for(const c of h.left)scope.push(...cellsInCol(c,n));for(const rg of h.rights)scope.push(...cellsInRegion(rg,n))}

 }
 function hallCandidateScope(type,h,s){
   if(!h)return [];
   const left=new Set(h.left),rights=new Set(h.rights),scope=[];
   for(let i=0;i<total;i++)if(s.cand[i]){
     const [a,b]=pairOf(i,type);
     if(left.has(a)&&rights.has(b))scope.push(i);
   }
   return uniqueCells(scope);
 }
 function matchingClue(s){
   const options=[];

   function reservedText(type,left,rights){
     const L=left.length,R=rights.length;
     if(type===0){
       return {
         intro:`Rows ${nums(left)} only contain ${R} possible columns.`,
         detail:`Those are columns ${nums(rights)}. ${L} rows need ${L} different columns, so those columns are reserved for those rows.`
       };
     }
     const colours=colourNames(rights);
     if(type===1){
       return {
         intro:`Rows ${nums(left)} only contain ${R} colours.`,
         detail:`They are ${colours}. ${L} rows need ${L} different colours, so those colours are reserved for those rows.`
       };
     }
     return {
       intro:`Columns ${nums(left)} only contain ${R} colours.`,
       detail:`Those colours are ${colours}. ${L} columns need ${L} different colours, so those colours are reserved for those columns.`
     };
   }

   function groupCells(type,left,rights){
     const L=new Set(left),R=new Set(rights),out=[];
     for(let i=0;i<total;i++)if(s.cand[i]){
       const [a,b]=pairOf(i,type);
       if(L.has(a)&&R.has(b))out.push(i);
     }
     return uniqueCells(out);
   }

   for(let type=0;type<3;type++){
     const adj=Array.from({length:n},()=>[]),edgeCells=Array.from({length:n},()=>Array.from({length:n},()=>[]));
     for(let i=0;i<total;i++)if(s.cand[i]){
       const [a,b]=pairOf(i,type);
       edgeCells[a][b].push(i);
     }
     for(let a=0;a<n;a++)for(let b=0;b<n;b++)if(edgeCells[a][b].length)adj[a].push(b);

     // If the player's current marks have already made a one-to-one assignment
     // impossible, report that before offering a new move.
     if(!hasPM(adj)){
       const h=hallFailure(adj);
       return {contradiction:true,reason:hallText(type,h),scopeCells:hallCandidateScope(type,h,s)};
     }

     for(let a=0;a<n;a++)for(const b of adj[a]){
       if(hasPM(adj,a,b))continue;

       const targets=edgeCells[a][b].filter(i=>!s.fixed[i]);
       if(!targets.length)continue;

       // Forcing a->b exposes a deficient set among the *other* units. In the
       // original puzzle that set has exactly one extra option: b. Therefore
       // that set + b is a directly visible reserved group; no trial language
       // is required in the hint.
       const h=hallFailure(adj,a,b);
       if(!h||!h.left.length)continue;
       const rights=[...new Set([...h.rights,b])].sort((x,y)=>x-y);
       if(rights.length!==h.left.length)continue;

       // Size-one reservations are simpler region/line or singleton deductions
       // and are handled by earlier tiers.
       if(h.left.length<2)continue;

       const copy=reservedText(type,h.left,rights);
       const reserved=groupCells(type,h.left,rights);
       const stage2=uniqueCells([...reserved,...targets]);

       let consequence;
       if(type===0)consequence=`Row ${a+1} is outside that group, so it cannot use column ${b+1}.`;
       else if(type===1)consequence=`Row ${a+1} is outside that group, so it cannot use the ${regionColourName(b)} region.`;
       else consequence=`Column ${a+1} is outside that group, so it cannot use the ${regionColourName(b)} region.`;

       options.push({
         complexity:h.left.length,
         typeRank:type,
         key:`match-${type}-${a}-${b}`,
         type:'matching',
         targetCells:targets,
         intro:copy.intro,
         detail:`${copy.detail} ${consequence}`,
         reveal:`Cross ${cellRefs(targets)}.`
       });
     }
   }

   if(!options.length)return null;
   options.sort((x,y)=>x.complexity-y.complexity||x.typeRank-y.typeRank||x.targetCells.length-y.targetCells.length);
   return options[0];
 }
 function deterministicPropagate(s,trace=[]){
   const add=(text,cells=[])=>{if(trace.length<6)trace.push({text,cells:uniqueCells(cells)})};
   let guard=0;
   while(!s.bad&&guard++<500){
     if(!checkUnits(s))break;
     let single=null;
     for(let kind=0;kind<3&&!single;kind++)for(let u=0;u<n&&!single;u++){
       let cnt=0,last=-1;for(const i of unitCells(kind,u))if(s.cand[i]){cnt++;last=i}
       if(cnt===0){setBad(s,`${kind===0?'row':kind===1?'column':'a colour region'} ${kind<2?u+1:''}`.trim()+` would have no legal square`);break}
       if(cnt===1&&!s.fixed[last])single={i:last,kind,u};
     }
     if(s.bad)break;
     if(single){
       const r=Math.floor(single.i/n),c=single.i%n,label=unitName(single.kind,single.u);
       add(`${label[0].toUpperCase()+label.slice(1)} has only one candidate, forcing row ${r+1}, column ${c+1} to contain 😎.`,[single.i,...unitCells(single.kind,single.u)]);
       place(s,single.i);continue;
     }
     let changed=false;
     for(let i=0;i<total&&!s.bad;i++)if(s.cand[i]){
       const r=Math.floor(i/n),c=i%n;
       for(const rr of [r-1,r+1])if(rr>=0&&rr<n){
         let ok=false;for(let cc=0;cc<n;cc++){const j=rr*n+cc;if(s.cand[j]&&Math.abs(cc-c)>1){ok=true;break}}
         if(!ok&&remove(s,i)){
           changed=true;add(`Row ${r+1}, column ${c+1} cannot contain 😎 because every remaining option in adjacent row ${rr+1} would touch it diagonally.`,[i,...cellsInRow(rr,n)]);break;
         }
       }
     }
     if(s.bad)break;if(changed)continue;
     for(let type=0;type<3&&!s.bad;type++){
       const adj=Array.from({length:n},()=>[]),edgeCells=Array.from({length:n},()=>Array.from({length:n},()=>[]));
       for(let i=0;i<total;i++)if(s.cand[i]){const [a,b]=pairOf(i,type);edgeCells[a][b].push(i)}
       for(let a=0;a<n;a++)for(let b=0;b<n;b++)if(edgeCells[a][b].length)adj[a].push(b);
       if(!hasPM(adj)){
         const h=hallFailure(adj);setBad(s,hallText(type,h));add(`This is impossible because ${hallText(type,h)}.`,hallScope(type,h));break;
       }

         if(cells.length)add(`${names.a[0].toUpperCase()+names.a.slice(1)} cannot use ${names.b}: if it did, ${hallText(type,h)}.`,[...cells,...hallScope(type,h)]);

     }

   }

 }
 function candidateOrder(s){
   const scores=[];for(let i=0;i<total;i++)if(s.cand[i]&&!s.fixed[i]){const r=Math.floor(i/n),c=i%n,rg=regions[i];let rc=0,cc=0,gc=0;for(let x=0;x<n;x++){rc+=s.cand[r*n+x];cc+=s.cand[x*n+c]}for(let j=0;j<total;j++)if(regions[j]===rg)gc+=s.cand[j];scores.push([Math.min(rc,cc,gc),rc+cc+gc,i])}scores.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);return scores.map(x=>x[2]);
 }


 const s=makeState();
 // Apply the player's explicit X marks first, then their placed markers.
 for(let i=0;i<total;i++)if(state.marks[i]===1)s.cand[i]=0;
 for(let i=0;i<total;i++)if(state.marks[i]===2)place(s,i);
 if(!checkUnits(s)||s.bad){return {key:'current-contradiction',type:'contradiction',targetCells:[],scopeCells:[],intro:'Your current marks have made the puzzle impossible.',detail:`As marked, ${s.reason || 'at least one row, column or colour has no legal completion'}.`,reveal:'Undo or reconsider one of your X marks.'}}

 let conflict=currentAdjacentRowConflict(s);
 if(conflict)return conflict;

 // Same ordering as the difficulty engine's deterministic propagation.
 // Strict human-complexity order. A later tier is never considered while
 // any move from an earlier tier exists.
 let clue=findSingletonClue(s);if(clue)return clue;

 clue=arcClue(s);if(clue)return clue;

 // No non-trial deduction remains. Do not pick or demonstrate a branch.
 return {
   key:'trial-required',
   type:'trial',
   targetCells:[],
   scopeCells:[],
   intro:'No simpler deduction is available — you’re going to have to move forward with trial and error.',
   detail:'No simpler deduction is available — you’re going to have to move forward with trial and error.',
   reveal:'No simpler deduction is available — you’re going to have to move forward with trial and error.'
 };
}
function hint(){
 if(!state||state.complete||state.failed)return;
 state.hintUsed=true;state.hintCount=(state.hintCount||0)+1;updatePuzzleMeta();scheduleSave();clearHint();
 const clue=logicHintClue();
 if(!clue){setMessage('No further deduction was found from the current marks.');state.activeHint=null;return}
 if(clue.type==='trial'){
   state.activeHint=null;
   setMessage('No simpler deduction is available — you’re going to have to move forward with trial and error.');
   return;

}
